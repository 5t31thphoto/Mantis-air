; ============================================================
;  Mantis Rally — M5Stack Core2 (Arduino + M5Unified)
;  a rally car through stages that dream themselves
; ============================================================
[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = partitions.csv   ; one 3 MB app slot, no SPIFFS (MantisCore installs only the measured image: see the file)
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; The LCD runs at 80 MHz (display.cpp, MP_LCD_MHZ). It had corrupted the picture because the SD card's setup moves the
; LCD's clock and data pins onto the GPIO matrix, which can't carry 80 MHz; display.cpp puts them back on the IO MUX.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
; the renderer's inner loops run from instruction RAM (IRAM_ATTR). If a link ever fails with
; "iram0_0_seg overflowed", add -DMR_NO_IRAM here to put them back in flash.
; our hot loops run faster at -O2; the framework and libraries keep -Os so the app stays small
build_src_flags =
    -O2
    -fno-math-errno
; the PSRAM cache workaround is for ESP32 revisions 0 and 1; the Core2 is an ESP32-D0WDQ6-V3, which doesn't have the
; fault. The workaround puts memory barriers into every store-heavy loop, so it comes off (nothing else changes).
build_unflags =
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
; everything pinned to MantisPlanet's working build (same platform, framework and libraries on the same Core2)
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py
